```html
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AI Studio</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="app">

    <aside class="sidebar">
      <div class="brand">
        <span class="brand-icon">✦</span>
        <span>AI Studio</span>
      </div>

      <button id="newChat" class="new-chat">＋ New Chat</button>

      <div class="sidebar-title">Recent chats</div>
      <div id="chatList" class="chat-list"></div>

      <div class="sidebar-bottom">
        <button id="clearAll" class="ghost-btn">
          Clear chat history
        </button>
      </div>
    </aside>

    <section class="workspace">

      <header class="topbar">
        <div>
          <h1 id="pageTitle">AI Chat</h1>
          <p id="statusLine">Gemini • gemini-3.6-flash</p>
        </div>

        <button
          id="themeToggle"
          class="icon-btn"
          title="Toggle theme"
        >
          ☾
        </button>
      </header>

      <nav class="tabs">
        <button class="tab active" data-mode="chat">
          💬 Chat
        </button>

        <button class="tab" data-mode="image">
          🖼️ Image
        </button>

        <button class="tab" data-mode="video">
          🎬 Video
        </button>

        <button class="tab" data-mode="voice">
          🎙️ Voice
        </button>

        <button class="tab" data-mode="captions">
          📝 Captions
        </button>
      </nav>

      <main id="content" class="content">

        <div id="chatPanel" class="panel">

          <div id="chat" class="chat">

            <div class="welcome">

              <div class="welcome-icon">✦</div>

              <h2>How can I help?</h2>

              <p>
                Ask anything. Your
                <strong>Gemini</strong>
                AI will answer.
              </p>

              <div class="suggestions">

                <button class="suggestion">
                  Explain artificial intelligence simply.
                </button>

                <button class="suggestion">
                  Write a short Urdu story.
                </button>

                <button class="suggestion">
                  Help me learn JavaScript.
                </button>

                <button class="suggestion">
                  Pakistan ka capital kya hai?
                </button>

              </div>

            </div>

          </div>

          <form id="form" class="composer">

            <button
              type="button"
              id="micBtn"
              class="round-btn"
              title="Voice input"
            >
              🎙️
            </button>

            <input
              id="input"
              autocomplete="off"
              placeholder="Message AI Studio..."
            />

            <button
              id="sendBtn"
              class="send-btn"
              type="submit"
            >
              Send ➤
            </button>

          </form>

        </div>

        <div id="toolPanel" class="panel hidden">
          <div id="toolCard" class="tool-card"></div>
        </div>

      </main>

    </section>

  </div>

  <script src="app.js"></script>

</body>
</html>
```
